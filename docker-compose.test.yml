# docker-compose.test.yml — override de TEST
# Uso: docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.test up --build

services:
  backend:
    container_name: sgpmp-backend-test
    environment:
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    # Puerto distinto al de dev (8000), para poder correr ambos a la vez si hace falta comparar.
    ports:
      - "8001:8000"
    # Sin "command:" — usa el CMD por defecto del Dockerfile (uvicorn sin --reload).

  frontend:
    container_name: sgpmp-frontend-test
    build:
      target: prod
      # target "prod" (nginx + estáticos): estas variables se HORNEAN en el build,
      # no se pueden cambiar después con "environment:" en tiempo de ejecución.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_VAPID_KEY: ${VITE_VAPID_KEY}
    ports:
      - "8081:80"
