# docker-compose.yml — BASE (servicios comunes a los 3 entornos)
#
# Requisitos para que este compose funcione:
# 1. Los repos backend y frontend deben estar clonados como HERMANOS de este repo
#    (misma carpeta padre): ../sgpmp-backend y ../SGPMP-FRONT-END-PWA
# 2. Cada uno debe tener ya su Dockerfile colocado en la raíz (ver docs/dockerFiles/
#    para las copias de referencia, mientras se fusionan sus respectivos PR).
# 3. La BD del DBA debe estar corriendo ANTES de levantar este compose
#    (scripts/restaurar-bd.sh, o "docker start SGPMP" si ya fue restaurada).
#    No se define aquí ningún servicio de base de datos: se adopta el contenedor
#    del DBA tal cual, conectándose a su red, sin duplicar su definición.

services:
  backend:
    build:
      context: ../sgpmp-backend
      dockerfile: Dockerfile

  frontend:
    build:
      context: ../SGPMP-FRONT-END-PWA
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: docker_default
    external: true
