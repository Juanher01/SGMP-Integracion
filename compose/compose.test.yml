# compose.test.yml — override de TEST
#
# TEST consume imágenes versionadas y no realiza builds locales.
# Las imágenes y credenciales se suministran mediante .env.test.
#
# Uso desde la raíz del repositorio:
# docker compose -f compose/docker-compose.yml -f compose/compose.test.yml --env-file .env.test up -d

services:

  database:
    image: ${DATABASE_IMAGE}
    container_name: sgpmp-database-test

  mosquitto:
    container_name: sgpmp-mosquitto-test
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ../../BROKER-MQTT-SGPMP-develop/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  gateway:
    image: ${GATEWAY_IMAGE}
    container_name: sgpmp-gateway-test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: ${GATEWAY_DATABASE_URL}
      API_TOKEN: ${GATEWAY_API_TOKEN}
      MQTT_TLS: "false"
    ports:
      - "8003:8000"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: sgpmp-backend-test
    environment:
      ENVIRONMENT: test
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    ports:
      - "8001:8000"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: sgpmp-frontend-test
    ports:
      - "8081:80"
