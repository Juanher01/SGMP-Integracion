# docker-compose.yml — BASE
#
# Define los servicios y recursos comunes de los ambientes DEV, TEST y PROD.
# Las diferencias específicas de cada ambiente se establecen mediante:
#
#   compose.dev.yml
#   compose.test.yml
#   compose.prod.yml
#
# Backend y frontend se construyen desde sus repositorios correspondientes.
# La capa de base de datos se integra a partir de DBIntegrador.
# La capa AIoT se integra a partir de BROKER-MQTT-SGPMP.
#
# Los valores sensibles y específicos de cada ambiente se suministran
# mediante los archivos .env correspondientes y no se almacenan aquí.

services:

  database:
    networks:
      - sgpmp-network
    volumes:
      - postgres-data:/var/lib/postgresql
    command: >
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${DB_NAME:-dba}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-dba} -d ${DB_NAME:-dba}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    networks:
      - sgpmp-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - sgpmp-network
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      DB_SCHEMA_INGEST: modulo3
      DB_SCHEMA_REGISTRY: modulo9
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../../sgpmp-backend
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    networks:
      - sgpmp-network

  frontend:
    build:
      context: ../../SGPMP-FRONT-END-PWA
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sgpmp-network


networks:
  sgpmp-network:
    driver: bridge


volumes:
  postgres-data:
